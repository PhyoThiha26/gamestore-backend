{% extends "admin/admin_base.html" %}

{% block content %}

<div class="container py-5">

    <div class="sold-card">

        <h1 class="mb-4">

            Mark Listing as Sold

        </h1>

        <div class="sold-preview mb-4">

            <img
                src="{{ url_for(
                    'static',
                    filename='uploads/' + listing.image
                ) }}"
                class="sold-image"
            >

            <div>

                <h3>

                    {{ listing.title }}

                </h3>

                <p class="text-secondary">

                    Buy Price:
                    ${{ listing.buy_price }}

                </p>

            </div>

        </div>

        <form method="POST">

            <div class="mb-4">

                <label class="form-label">

                    Sold Price

                </label>

                <input
                    type="number"
                    step="0.01"
                    name="sold_price"
                    class="form-control admin-input"
                    placeholder="How much did you sell this for?"
                    required
                >

            </div>

            <button
                type="submit"
                class="mark-sold-btn"
            >

                Confirm Sale

            </button>

        </form>

    </div>

</div>

<style>

.sold-card {

    max-width: 700px;

    margin: auto;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.05),
            rgba(255,255,255,0.02)
        );

    border:
        1px solid rgba(255,255,255,0.06);

    border-radius: 30px;

    padding: 40px;
}

/* PREVIEW */

.sold-preview {

    display: flex;

    gap: 20px;

    align-items: center;
}

/* IMAGE */

.sold-image {

    width: 140px;

    height: 140px;

    border-radius: 20px;

    object-fit: cover;
}

/* BUTTON */

.mark-sold-btn {

    width: 100%;

    border: none;

    padding: 18px;

    border-radius: 18px;

    background: white;

    color: black;

    font-weight: 700;

    transition: 0.3s ease;
}

.mark-sold-btn:hover {

    transform:
        translateY(-2px);
}

</style>

{% endblock %}
